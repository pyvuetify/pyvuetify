name: Documentation

on:
  push:
    branches: [main]
  pull_request:

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel in-progress deploys
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_COLOR: 1
  PIP_ROOT_USER_ACTION: ignore

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "latest"

      - uses: astral-sh/setup-uv@v6

      # Cache node_modules — invalidated only when package-lock.json changes
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-${{ hashFiles('package-lock.json') }}

      # Cache uv's download cache — invalidated when pyproject.toml or uv.lock changes
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      # KEY ADVANTAGE over ReadTheDocs: the executed notebook outputs are cached.
      # If no RST file or Python example changed, jupyter_sphinx skips execution
      # entirely and reuses the previous results.
      - name: Cache jupyter_execute (notebook execution outputs)
        uses: actions/cache@v4
        with:
          path: docs/_build/jupyter_execute
          key: jupyter-${{ hashFiles('docs/**/*.rst', 'docs/**/*.py', 'docs/**/*.vue') }}
          restore-keys: jupyter-

      - name: Install npm dependencies
        run: npm install

      # generate_components.py must run before `uv sync` because the hatch
      # build hook (hatch-jupyter-builder) calls `npm run build` during pip
      # install, which needs js/_component/ to already exist.
      - name: Generate component files
        run: |
          pip install jinja2 jinja2-strcase
          cd generate && python generate_components.py

      # Installs pyvuetify (editable) + all docs dependencies.
      # The hatch-jupyter-builder hook runs `npm run build` here, producing
      # pyvuetify/_static/*.js and pyvuetify/_static/pyvuetify.css.
      - name: Install pyvuetify with docs dependencies
        run: uv sync --group docs

      - name: Build documentation
        run: uv run sphinx-build -b html docs docs/_build/html

      # Only upload the artifact when building the main branch
      - name: Upload pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
