# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# build with latest available ubuntu version
build:
  os: ubuntu-lts-latest
  tools:
    python: "3.12"
    nodejs: "latest"
  jobs:
    pre_install:
      # js/_component and pyvuetify/_component are gitignored (generated files).
      # Generate them before hatch runs "npm run build" during pip install.
      - npm install
      - pip install jinja2 jinja2-strcase
      - cd generate && python generate_components.py

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py

# Optionally set the version of Python and requirements required to build your docs
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - doc
